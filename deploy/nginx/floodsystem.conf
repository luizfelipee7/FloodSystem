server {
    listen 80;
    listen [::]:80;
    server_name floodsystem.duckdns.org;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 308 https://floodsystem.duckdns.org$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name floodsystem.duckdns.org;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/floodsystem.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/floodsystem.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    root /srv/floodsystem/frontend/dist;
    index index.html;
    client_max_body_size 256k;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Cache-Control no-store always;
    }
    location = /api { return 308 /api/; }
    # Public scientific catalogue only. The upstream app has no write routes.
    location ^~ /article-api/v1/experiments {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8010/api/v1/experiments;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        add_header Cache-Control no-store always;
    }
    location ^~ /article-api/ { return 404; }
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control no-store always;
    }
    # Only compiled public assets are served; source/configuration/DB are outside root.
    location ~ /\. { deny all; }
    location ~* \.(db|sqlite|sqlite3|sql|env|key|pem)$ { return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
    }
}
