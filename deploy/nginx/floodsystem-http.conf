# Bootstrap for the HTTP-01 certificate challenge. No API exposed over HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name floodsystem.duckdns.org;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 503; }
}
